[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sky130-verify"
version = "0.1.0"
description = "Headless DRC/LVS verification of a single Sky130A cell, with a provenance manifest and badge."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
classifiers = [
    "Environment :: Console",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "jsonschema>=4.18",
    "tomli>=2.0; python_version<'3.11'",
]

[project.urls]
Repository = "https://github.com/clementchmlt/sky130-verify"
Issues = "https://github.com/clementchmlt/sky130-verify/issues"

[project.scripts]
sky130-verify = "sky130_verify.cli:main"

[tool.setuptools]
packages = ["sky130_verify"]

[tool.setuptools.package-data]
sky130_verify = ["tcl/*.tcl"]
