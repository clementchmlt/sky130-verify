[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "sky130-verify"
dynamic = ["version"]
description = "Headless DRC/LVS verification of a single Sky130A cell, with a provenance manifest and badge."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["sky130", "drc", "lvs", "magic", "netgen", "eda"]
classifiers = [
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "jsonschema>=4.18",
    "tomli>=2.0; python_version<'3.11'",
]

[project.urls]
Repository = "https://github.com/clementchamalet/sky130-verify"
Issues = "https://github.com/clementchamalet/sky130-verify/issues"
Changelog = "https://github.com/clementchamalet/sky130-verify/blob/main/CHANGELOG.md"

[project.scripts]
sky130-verify = "sky130_verify.cli:main"

[tool.setuptools.packages.find]
include = ["sky130_verify"]
namespaces = false

[tool.setuptools.dynamic]
version = {attr = "sky130_verify.__version__"}

[tool.setuptools.package-data]
sky130_verify = ["tcl/*.tcl"]
