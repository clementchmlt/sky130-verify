name: Publish to PyPI

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Release tag to publish
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Validate release tag
        env:
          RELEASE_REF: ${{ inputs.ref }}
        run: |
          test "$RELEASE_REF" = "$(git describe --exact-match --tags HEAD)"
          test "$RELEASE_REF" = "v$(python -c 'from sky130_verify import __version__; print(__version__)')"
      - name: Build distributions
        run: |
          python -m pip install --upgrade build twine
          python -m build
          twine check dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: distributions
          path: dist/*

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: distributions
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
